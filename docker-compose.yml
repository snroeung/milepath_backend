services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - covelo-local
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-http:
    image: hiett/serverless-redis-http:latest
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SRH_MODE: env
      SRH_TOKEN: local_dev_token
      SRH_CONNECTION_STRING: "redis://redis:6379"
    ports:
      - "8079:80"
    networks:
      - covelo-local

networks:
  covelo-local:
